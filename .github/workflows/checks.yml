# Checks on every pull request: the build runs, content and links are sound, and screenshots of every page
# (phone and desktop) are compared with main. The screenshot comparison never blocks a merge; it shows what changed.
name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow jinja2
      - name: Build
        run: python3 tools/build.py
      - name: Check content, dates and links
        run: python3 tools/check.py
      - name: Pages match the content
        run: |
          if ! git diff --quiet; then
            echo "::warning::Running tools/build.py changed these files. They'll be rebuilt on merge, but the preview of this PR is out of date:"
            git diff --stat
          fi

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: head }
      - uses: actions/checkout@v4
        with: { path: base, ref: '${{ github.event.pull_request.base.sha || github.sha }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow jinja2 playwright && python -m playwright install --with-deps chromium
      - name: Build this branch
        run: python3 head/tools/build.py
      - name: Screenshots of main
        run: python3 head/tools/screens.py base shots-before
      - name: Screenshots of this branch
        run: python3 head/tools/screens.py head shots-after
      - name: Compare
        run: python3 head/tools/screendiff.py shots-before shots-after screenshots
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: screenshots, if-no-files-found: ignore }
